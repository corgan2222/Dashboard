name: Build & Release

# Triggers on version tags: git tag v2.01 && git push --tags
on:
  push:
    tags:
      - 'v*'
  # Also allows manual trigger from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.2.3) — required for manual runs'
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: build:win
            artifact_name: windows
            artifact_glob: dist/*.exe

          - os: ubuntu-latest
            build_cmd: build:linux
            artifact_name: linux
            artifact_glob: dist/*.AppImage

          - os: macos-latest
            build_cmd: build:mac
            artifact_name: mac
            artifact_glob: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build (${{ matrix.os }})
        run: npm run ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create a GitHub Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect categorized notes from the Release Drafter draft
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Pull the body of the standing Release Drafter draft (categorized notes).
          body=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft==true)] | sort_by(.created_at) | last | .body // ""')
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$body"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (drafted categorized notes)
        if: steps.notes.outputs.body != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: artifacts/**/*
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (fallback auto notes)
        if: steps.notes.outputs.body == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true   # fallback when no draft notes exist yet
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the consumed Release Drafter draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # The draft's notes are now on the published release; drop it so the
          # next master push re-drafts cleanly for the following version.
          draft_id=$(gh api "repos/$REPO/releases" \
            --jq '[.[] | select(.draft==true)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$draft_id" ]; then
            gh api -X DELETE "repos/$REPO/releases/$draft_id"
            echo "Deleted consumed draft $draft_id"
          else
            echo "No draft to delete"
          fi
